name: build

on: [push, pull_request, workflow_dispatch]

env:
  # Raised from 1.90.0 for `openssl-io`. Note the driver is that crate's
  # dev-dependency on the `compio` umbrella (compio-executor uses `cfg_select!`,
  # stabilized in 1.95); openssl-io's own library dependencies build on 1.93.
  RUST_MSRV: "1.95.0"

jobs:
  setup:
    runs-on: ubuntu-26.04
    outputs:
      rust-msrv: ${{ env.RUST_MSRV }}
      rust-version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: parse
        run: |
          version=$(grep 'channel' rust-toolchain.toml | sed 's/.*"\(.*\)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-26.04 ]
        rust: [ '${{ needs.setup.outputs.rust-msrv }}', '${{ needs.setup.outputs.rust-version }}' ]
    steps:
    - uses: actions/checkout@v7

    - name: Install rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy, llvm-tools

    - uses: taiki-e/install-action@cargo-llvm-cov

    - name: Setup system openssl and kernel tls
      run: |
        sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
        sudo modprobe tls
        cat /proc/sys/net/ipv4/tcp_available_ulp
        openssl version -a

    - name: Run cargo check
      run: cargo +${{ matrix.rust }} check --locked

    - name: Run cargo fmt
      run: cargo +${{ matrix.rust }} fmt --all -- --check

    - name: Run cargo clippy
      run: cargo +${{ matrix.rust }} clippy --locked --all-targets -- -D warnings

    - name: Run cargo test
      run: cargo +${{ matrix.rust }} test --locked --all -- --nocapture

    - name: Run llvm-cov
      run: cargo +${{ matrix.rust }} llvm-cov --locked --codecov --output-path codecov.json --ignore-filename-regex openssl-ktls-tests.*

    - name: Show cov summary
      run: cargo +${{ matrix.rust }} llvm-cov report --summary-only --ignore-filename-regex openssl-ktls-tests.*
